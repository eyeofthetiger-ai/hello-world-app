<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, world</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  .stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; }
  .hello {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: clamp(2rem, 9vw, 6rem); font-weight: 700; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
  }
  .status { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 14px; opacity: 0.8; }
</style>
</head>
<body>
<div class="stage">
  <video id="video" autoplay muted playsinline></video>
  <div class="hello">Hello, world.</div>
  <div class="status" id="status">Connecting to your EOT-1&hellip;</div>
</div>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const say = (text) => { statusEl.textContent = text; };

// One WebRTC (WHEP) session against the stream's playback URL. Resolves
// when the connection ends, so the loop below can reconnect.
async function watch(playbackUrl) {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }] });
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });
  pc.ontrack = (e) => { video.srcObject = e.streams[0]; };
  try {
    await pc.setLocalDescription(await pc.createOffer());
    // Wait for ICE gathering (up to 3s) so one POST carries every candidate.
    await Promise.race([
      new Promise((r) => pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && r())),
      sleep(3000),
    ]);
    // Cloudflare answers 409 until the EOT-1 has finished connecting.
    let res;
    for (let i = 0; i < 8; i++) {
      res = await fetch(playbackUrl, { method: "POST", headers: { "content-type": "application/sdp" }, body: pc.localDescription.sdp });
      if (res.status !== 409) break;
      await sleep(1500);
    }
    if (!res.ok) throw new Error(`stream answered ${res.status}`);
    await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
    say("");
    await new Promise((r) => {
      pc.onconnectionstatechange = () => ["failed", "disconnected", "closed"].includes(pc.connectionState) && r();
    });
  } finally {
    pc.close();
    video.srcObject = null;
  }
}

(async () => {
  for (;;) {
    try {
      const res = await fetch(`live-stream?token=${encodeURIComponent(token)}`);
      if (res.status === 401) return say("This link has expired. Open the app again from the portal.");
      if (res.status === 409) {
        say("Your EOT-1 is offline. This page connects once it's back online.");
      } else if (res.status === 404) {
        say("No live stream yet. Opening the app from the portal starts one.");
      } else if (!res.ok) {
        say(`Couldn't reach your EOT-1 (${(await res.json()).error})`);
      } else {
        say("Connecting to the live stream…");
        await watch((await res.json()).webrtc_playback_url);
        say("The live stream stopped. Reconnecting…");
      }
    } catch (e) {
      say(`Couldn't connect: ${e.message}`);
    }
    await sleep(3000);
  }
})();
</script>
</body>
</html>
